<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Workout Log">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Workout Log</title>
<style>
  :root {
    --bg: #0f1115; --card: #181b22; --card2: #1f232c; --line: #2a2f3a;
    --text: #e9ebef; --muted: #8b919d; --accent: #d4ff3a; --accent-ink: #141a00;
    --ok: #4ade80; --warn: #fbbf24; --err: #f87171; --info: #60a5fa;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Arabic", sans-serif; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: var(--accent); }

  .topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px;
    padding: 10px 16px; padding-top: max(10px, env(safe-area-inset-top));
    background: rgba(15,17,21,.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .brand { font-weight: 800; letter-spacing: .3px; }
  .brand b { color: var(--accent); }
  .topbar .spacer { flex: 1; }
  .sheet-name { color: var(--muted); font-size: 13px; max-width: 45vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  main { max-width: 720px; margin: 0 auto; padding: 16px 14px 8px; }
  .site-foot { max-width: 720px; margin: 0 auto; padding: 8px 14px 110px; text-align: center; font-size: 13px; color: var(--muted); }
  .site-foot a { color: var(--muted); }
  /* ---------- tabs & insights ---------- */
  .tabs { display: flex; gap: 4px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 4px; margin: 4px 0 12px; }
  .tabs button { flex: 1; border: 0; background: none; border-radius: 9px; padding: 9px; font-weight: 700; color: var(--muted); }
  .tabs button.on { background: var(--card2); color: var(--text); }
  .tabs.five button { padding: 9px 2px; font-size: 14px; }
  .ins-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 4px 0; }
  .seg { display: inline-flex; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
  .seg button { border: 0; background: none; color: var(--muted); padding: 6px 12px; border-radius: 8px; font-weight: 600; font-size: 14px; }
  .seg button.on { background: var(--card2); color: var(--text); }
  .seg.small button { padding: 4px 10px; font-size: 13px; }
  .panel.ins { padding: 16px; margin: 12px 0; }
  .panel.ins h2 { font-size: 17px; margin: 0 0 2px; }
  .h-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .sub { color: var(--muted); font-size: 13px; margin: 2px 0 12px; }
  .ch-title { font-size: 13px; font-weight: 600; color: var(--muted); margin: 16px 0 6px; }
  .hl { list-style: none; padding: 0; margin: 10px 0 0; }
  .hl li { display: flex; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .hl li:first-child { border-top: 0; }
  .hl-ic { flex: none; width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; background: var(--card2); color: var(--muted); font-size: 12px; }
  .hl-ic.good, .b-ic.good { color: #0ca30c; } .hl-ic.warn, .b-ic.warning { color: #fab219; }
  .tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 12px 0; }
  @media (min-width: 620px) { .tiles { grid-template-columns: repeat(3, 1fr); } }
  .tiles.three { grid-template-columns: repeat(3, 1fr); }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; min-width: 0; }
  .panel .tile { background: var(--card2); }
  .t-label { font-size: 12px; color: var(--muted); }
  .t-value { font-size: 22px; font-weight: 700; margin: 2px 0; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tiles.three .t-value { font-size: 18px; }
  .t-sub { font-size: 12px; color: var(--muted); line-height: 1.35; }
  .chart { position: relative; width: 100%; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart .ax { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .chart .lbl { fill: #cfd3da; font-size: 11px; }
  .chart .hits rect, .chart .ov { cursor: crosshair; touch-action: pan-y; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: #cfd3da; margin: 0 0 8px; }
  .legend i, .sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .legend b { color: var(--muted); font-weight: 600; }
  #vizTip { position: fixed; z-index: 70; display: none; pointer-events: none; background: #0b0d11; border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 10px; font-size: 13px; line-height: 1.5; max-width: 260px; box-shadow: 0 8px 24px rgba(0,0,0,.45); }
  details.dt { margin-top: 6px; font-size: 13px; }
  details.dt summary { color: var(--muted); cursor: pointer; }
  .dt-wrap { overflow-x: auto; }
  .dt table, .tbl-plan { width: 100%; border-collapse: collapse; font-size: 13px; }
  .dt th, .dt td, .tbl-plan th, .tbl-plan td { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .dt th, .tbl-plan th { color: var(--muted); font-weight: 600; font-size: 12px; }
  .tbl-plan td:nth-child(2) { width: 45%; }
  .num { font-variant-numeric: tabular-nums; }
  .inbar { display: inline-block; vertical-align: middle; width: calc(100% - 30px); height: 8px; background: var(--card2); border-radius: 4px; margin-right: 8px; }
  .inbar span { display: block; height: 100%; background: #3987e5; border-radius: 4px; }
  .nextup { background: var(--card2); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; font-size: 14px; }
  .ex-list { display: grid; gap: 2px; }
  .ex-row { display: grid; grid-template-columns: 1fr 72px 52px; grid-template-areas: "name spark chg" "name st st"; gap: 2px 10px; align-items: center;
    text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 10px 6px; border-radius: 8px; }
  @media (min-width: 620px) { .ex-row { grid-template-columns: 1fr 72px 56px 130px; grid-template-areas: "name spark chg st"; } }
  .ex-name { grid-area: name; font-weight: 600; text-transform: capitalize; min-width: 0; }
  .ex-name small { display: block; color: var(--muted); font-weight: 400; font-size: 12px; text-transform: none; }
  .spark { grid-area: spark; } .ex-chg { grid-area: chg; text-align: right; font-size: 13px; } .ex-st { grid-area: st; justify-self: end; }
  .badge { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; color: #cfd3da; background: var(--card2); border-radius: 999px; padding: 3px 9px; white-space: nowrap; }
  .b-ic { font-size: 10px; color: var(--muted); }
  .legend-line { margin-top: 10px; line-height: 2; }
  .pt-box { background: var(--card2); border-radius: 12px; padding: 12px 14px; margin: 14px 0; display: block; }
  .pt-box:has(> span) { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .pt-box .text-btn { white-space: nowrap; }
  .pt-check { display: flex; align-items: center; gap: 10px; font-weight: 600; cursor: pointer; }
  .pt-check input { width: 18px; height: 18px; accent-color: var(--accent); }
  #ptPw { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px; min-width: 0; }
  #ptPw:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .err-text { color: var(--err); }
  .day-note { font-size: 13px; color: var(--muted); margin: -2px 0 4px; }
  /* ---------- plan editor (PT) ---------- */
  .eyebrow { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 0 0 6px; }
  .pl-days { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
  .pl-days > div { background: var(--card2); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; }
  .pl-choices { border: 0; padding: 0; margin: 14px 0; display: grid; gap: 8px; }
  .pl-choices legend { font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin-bottom: 8px; }
  .pl-choices label, .pl-check { display: flex; gap: 12px; align-items: flex-start; background: var(--card2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer; }
  .pl-choices label:has(input:checked) { border-color: var(--accent); }
  .pl-choices input, .pl-check input { width: 18px; height: 18px; accent-color: var(--accent); margin: 2px 0 0; flex: none; }
  .pl-top { display: flex; align-items: center; justify-content: space-between; margin: 0 0 8px; }
  .pl-daybar { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; margin: -4px 0 4px; font-size: 14px; }
  .text-btn:disabled { color: var(--muted); opacity: .5; cursor: default; }
  .icon-btn:disabled { opacity: .35; cursor: default; }
  .pl-add-day { border-style: dashed !important; color: var(--accent) !important; background: none !important; }
  .pl-move { display: flex; flex-direction: column; gap: 4px; }
  .pl-move .icon-btn { width: 30px; height: 26px; border-radius: 8px; }
  .pl-del { color: var(--err) !important; }
  .pl-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
  .pl-grid label, .pl-note { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }
  .pl-note { margin-top: 10px; }
  .pl-grid input, .pl-note input { display: block; width: 100%; margin-top: 4px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 9px; color: var(--text); font-size: 15px; text-transform: none; letter-spacing: 0; }
  .pl-grid input { text-align: center; font-variant-numeric: tabular-nums; }
  .pl-note input { font-size: 14px; }
  .pl-grid input:focus, .pl-note input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  .pl-add { color: var(--accent); } .pl-rem { color: var(--err); } .pl-mod { color: var(--warn); }
  .day-note b { color: var(--text); font-weight: 600; }
  /* ---------- PT targets (purple is used for nothing else) ---------- */
  .chip.pt { color: #c4b5fd; background: #221c33; }
  .pt-band { display: flex; gap: 8px; align-items: flex-start; margin: 10px 0 0; padding: 8px 10px; border-radius: 10px; background: #221c33; border: 1px solid #4c3d78; color: #ddd3ff; font-size: 13px; line-height: 1.35; }
  .pt-band b { color: #fff; }
  .set-row.head .pt-head { color: #c4b5fd; }
  .ptcell { border: 1px solid #6d58b8; background: #1d1830; border-radius: 10px; padding: 5px 8px; text-align: left; line-height: 1.2; min-width: 0; color: inherit; }
  .ptcell b { color: #c4b5fd; font-size: 14px; font-variant-numeric: tabular-nums; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ptcell small { display: block; color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ptcell.chg { box-shadow: 0 0 0 2px #a78bfa; }
  .ptnote { margin: -2px 0 6px 38px; font-size: 12px; color: #c4b5fd; }
  .pt-sync { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px; color: #c4b5fd; margin: 6px 0 0; }
  .pt-sync .text-btn { font-size: 13px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 8px; color: var(--text); white-space: nowrap; }
  .day.tgt::before, .day.tgu::before { content: ""; position: absolute; top: 4px; left: 6px; width: 7px; height: 7px; border-radius: 50%; background: #a78bfa; }
  .day.tgu::before { background: none; border: 1.5px solid #a78bfa; width: 5px; height: 5px; }
  .day.active.tgt::before { background: #4c1d95; } .day.active.tgu::before { border-color: #4c1d95; }
  .tg-legend { font-size: 12px; color: var(--muted); margin: -4px 0 8px; }
  .tg-legend i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #a78bfa; margin: 0 4px 0 0; vertical-align: 1px; }
  .tg-legend i.u { background: none; border: 1.5px solid #a78bfa; width: 5px; height: 5px; }
  .tg-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .tg-actions .btn { padding: 8px 12px; font-size: 14px; }
  .tg-row { grid-template-columns: 30px 1fr 64px 70px 34px; }
  /* ---------- cardio & Other sessions ---------- */
  .set-row.cardio-row { grid-template-columns: 30px 1fr 64px 1.25fr 0; }
  .set-row.cardio-row input[data-f="note"] { text-align: left; }
  .other-link { display: block; padding: 8px 0 0; font-weight: 700; text-align: left; }
  .cm { margin: 10px 0 0; padding: 10px 12px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); }
  .cm .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 14px; margin: 0; }
  .cm .row b { font-variant-numeric: tabular-nums; }
  .cm .bar { height: 8px; border-radius: 4px; background: var(--card2); margin: 8px 0 6px; overflow: hidden; }
  .cm .bar i { display: block; height: 100%; border-radius: 4px; background: #3987e5; }
  .cm.ok .bar i { background: #0ca30c; }
  .cm .sub { font-size: 12px; color: var(--muted); }
  .panel .cm { background: var(--card2); }
  /* ---------- diet ---------- */
  .seg.wide { display: flex; margin: 0 0 12px; }
  .seg.wide button { flex: 1; }
  .dp { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin: 0 0 12px; }
  .dp h3 { margin: 0 0 2px; font-size: 17px; }
  .dp .meta { color: var(--muted); font-size: 13px; }
  .dp .eyebrow { margin: 0; }
  .d-inp { display: block; width: 100%; min-width: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; font-size: 15px; }
  .d-inp.c { text-align: center; }
  .d-lbl { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 10px 0 4px; }
  .d-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .d-row4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .d-lim { display: grid; grid-template-columns: 52px 1fr; gap: 6px; }
  .d-lim select { padding: 9px 2px; text-align: center; }
  .mp { color: #7fb2ef; } .mc { color: #f0905c; } .mf { color: #5cc49c; }
  .d-food { display: flex; gap: 10px; align-items: center; padding: 11px 0; border-top: 1px solid var(--line); width: 100%; background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; color: inherit; }
  .d-food:first-child { border-top: 0; }
  .d-food .n { flex: 1; min-width: 0; }
  .d-food .n b { display: block; font-size: 15px; }
  .d-food .n span { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .d-chips { display: flex; gap: 6px; overflow-x: auto; margin: 0 0 10px; scrollbar-width: none; }
  .d-chips button { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 12px; font-size: 13px; white-space: nowrap; color: var(--muted); flex: none; }
  .d-chips button.on { background: var(--card2); color: var(--text); border-color: #3b4250; }
  .d-check { font-size: 12px; margin-top: 8px; padding: 7px 10px; border-radius: 9px; background: var(--card2); color: var(--muted); }
  .d-check.bad { color: #fcd9a0; background: #2a1f0c; }
  .d-pills { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .d-pills > * { font-size: 12px; border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; font-variant-numeric: tabular-nums; background: none; color: inherit; }
  .d-pills button.add { color: var(--accent); }
  .d-it { padding: 9px 0; border-top: 1px solid var(--line); }
  .d-it .top { display: flex; gap: 8px; align-items: baseline; }
  .d-it .top b { flex: 1; min-width: 0; font-size: 14px; }
  .d-it .top span { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .d-it .ctl { display: grid; grid-template-columns: 74px 92px 1fr auto; gap: 6px; align-items: center; margin-top: 6px; }
  .d-it .ctl .d-inp { padding: 7px 6px; font-size: 14px; }
  .d-it .ro { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .d-tot { margin-top: 8px; padding: 9px 10px; border-radius: 10px; background: var(--card2); font-size: 13px; line-height: 1.6; font-variant-numeric: tabular-nums; }
  .d-ok { color: #4ade80; } .d-over { color: #fb923c; } .d-low { color: #fbbf24; }
  .d-add { display: block; width: 100%; margin-top: 8px; border: 1px dashed var(--line); background: none; border-radius: 10px; padding: 9px; color: var(--accent); font-weight: 700; }
  .d-bars { display: grid; gap: 10px; }
  .d-mb .t { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
  .d-mb .t b { font-variant-numeric: tabular-nums; }
  .d-mb .bar { height: 8px; border-radius: 4px; background: var(--card2); margin-top: 4px; overflow: hidden; }
  .d-mb .bar i { display: block; height: 100%; border-radius: 4px; background: #3987e5; }
  .d-meal { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); margin: 0 0 10px; }
  .d-meal.open { border-color: #3b4250; }
  .d-meal .hd { display: flex; align-items: center; gap: 10px; width: 100%; background: none; border: 0; padding: 12px 14px; text-align: left; color: inherit; }
  .d-meal .hd .t { flex: 1; min-width: 0; }
  .d-meal .hd b { font-size: 16px; }
  .d-meal .hd span.s { display: block; font-size: 12px; color: var(--muted); }
  .d-meal .bd { padding: 0 14px 14px; }
  .d-st { font-size: 12px; font-weight: 700; border-radius: 999px; padding: 4px 10px; white-space: nowrap; }
  .d-st.eat { background: #13301f; color: #4ade80; } .d-st.cheat { background: #33240f; color: #fbbf24; } .d-st.skip { background: #2a2f3a; color: #c3c8d2; } .d-st.todo { background: var(--card2); color: var(--muted); }
  .d-sbtn { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 0 0 6px; }
  .d-sbtn button { border: 1px solid var(--line); background: var(--card2); border-radius: 10px; padding: 8px 2px; font-size: 12px; font-weight: 700; color: var(--text); }
  .d-sbtn button.on { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  .d-sbtn button:disabled { opacity: .4; }
  .d-sup { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); width: 100%; background: none; border-left: 0; border-right: 0; border-bottom: 0; color: inherit; text-align: left; }
  .d-sup:first-of-type { border-top: 0; }
  .d-box { width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--line); display: grid; place-items: center; font-weight: 800; flex: none; }
  .d-box.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .d-glass { display: flex; gap: 5px; flex-wrap: wrap; }
  .d-glass i { width: 20px; height: 26px; border: 2px solid #3987e5; border-radius: 3px 3px 7px 7px; display: block; }
  .d-glass i.f { background: #3987e5; }
  .d-nav { display: flex; align-items: center; justify-content: space-between; margin: 0 0 10px; }
  .d-nav button { border: 1px solid var(--line); background: var(--card); border-radius: 10px; width: 42px; height: 38px; color: var(--text); font-size: 18px; }
  .d-nav button:disabled { opacity: .3; }
  .d-nav b { font-size: 16px; }
  .d-tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
  .d-tbl td, .d-tbl th { padding: 7px 4px; border-top: 1px solid var(--line); text-align: left; }
  .d-tbl th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; border-top: 0; }
  .d-tbl .r { text-align: right; font-variant-numeric: tabular-nums; }
  .d-warn { margin-top: 10px; padding: 10px 12px; border-radius: 10px; border: 1px solid #6b4a12; background: #2a1f0c; color: #fcd9a0; font-size: 13px; line-height: 1.45; }
  .btn.danger { background: #f87171; color: #1a0505; }
  .d-list { max-height: 52vh; overflow-y: auto; margin: 8px -4px 0; padding: 0 4px; }
  textarea.d-inp { min-height: 80px; resize: vertical; font: inherit; }
  .result { text-align: center; padding: 6px 2px 2px; }

    callback: r => {
      const p = state.pendingToken; state.pendingToken = null;
      if (r.error) return p?.reject(new Error(r.error_description || r.error));
      state.token = r.access_token; state.tokenExpiry = Date.now() + (Number(r.expires_in || 3600) - 60) * 1000;
      state.authLost = false; p?.resolve();
    },
    error_callback: e => { const p = state.pendingToken; state.pendingToken = null; p?.reject(new Error(e?.type === 'popup_closed' ? 'Sign-in window was closed.' : (e?.message || 'Sign-in failed.'))); },
  });
  await new Promise(r => gapi.load('picker', r));
}
// Must be called directly from a click so the popup isn't blocked.
function requestToken() {
  return new Promise((resolve, reject) => { state.pendingToken = { resolve, reject }; state.tokenClient.requestAccessToken({ prompt: '' }); });
}
const tokenValid = () => state.token && Date.now() < state.tokenExpiry;

async function gfetch(url, opts = {}) {
  if (!tokenValid()) throw new AuthError('Your Google session expired.');
  const res = await fetch(url, { ...opts, headers: { Authorization: 'Bearer ' + state.token, 'Content-Type': 'application/json', ...(opts.headers || {}) } });
  if (res.status === 401) { state.token = null; throw new AuthError('Your Google session expired.'); }
  const body = await res.json().catch(() => ({}));
  if (!res.ok) { const err = new Error(body.error?.message || `${res.status} ${res.statusText}`); err.status = res.status; throw err; }
  return body;
}

const SHEETS = 'https://sheets.googleapis.com/v4/spreadsheets/';
const GoogleSource = {
  async meta(id) {
    const j = await gfetch(`${SHEETS}${id}?fields=properties.title,sheets.properties(sheetId,title,sheetType,gridProperties(rowCount,columnCount))`);
    // Dashboard/chart tabs aren't grids and have no gridProperties, so skip them.
    return { title: j.properties.title, sheets: (j.sheets || [])
      .filter(s => !s.properties.sheetType || s.properties.sheetType === 'GRID')
      .map(s => ({ title: s.properties.title, sheetId: s.properties.sheetId, rowCount: s.properties.gridProperties?.rowCount ?? 0 })) };
  },
  async batchGet(id, ranges) {
    const qs = ranges.map(r => 'ranges=' + encodeURIComponent(r)).join('&');
    const j = await gfetch(`${SHEETS}${id}/values:batchGet?${qs}&valueRenderOption=FORMATTED_VALUE`);
    return (j.valueRanges || []).map(v => v.values || []);
  },
  // Numbers and dates as raw values (dates as serial numbers) for the Insights calculations.
  async batchGetRaw(id, ranges) {
    const qs = ranges.map(r => 'ranges=' + encodeURIComponent(r)).join('&');
    const j = await gfetch(`${SHEETS}${id}/values:batchGet?${qs}&valueRenderOption=UNFORMATTED_VALUE&dateTimeRenderOption=SERIAL_NUMBER`);
    return (j.valueRanges || []).map(v => v.values || []);
  },
  async addRows(id, sheetId, n) {
    await gfetch(`${SHEETS}${id}:batchUpdate`, { method: 'POST', body: JSON.stringify({ requests: [{ appendDimension: { sheetId, dimension: 'ROWS', length: n } }] }) });
  },
  // RAW stores text exactly as typed (a comment starting with "=" stays text); USER_ENTERED parses dates.
  async update(id, range, values, input = 'USER_ENTERED') {
    await gfetch(`${SHEETS}${id}/values/${encodeURIComponent(range)}?valueInputOption=${input}`, { method: 'PUT', body: JSON.stringify({ range, majorDimension: 'ROWS', values }) });
  },
  async addSheet(id, title) {
    const j = await gfetch(`${SHEETS}${id}:batchUpdate`, { method: 'POST', body: JSON.stringify({ requests: [{ addSheet: { properties: { title } } }] }) });
    return j.replies[0].addSheet.properties.sheetId;
  },
};

function openPicker() {
  const view = new google.picker.DocsView(google.picker.ViewId.SPREADSHEETS).setMode(google.picker.DocsViewMode.LIST);
  const picker = new google.picker.PickerBuilder()
    .addView(view)
    .setOAuthToken(state.token)
    .setDeveloperKey(CONFIG.API_KEY)
    .setAppId(CONFIG.APP_ID)
    .setTitle('Choose your workout tracker sheet')
    .setCallback(d => {
      if (d.action === google.picker.Action.PICKED) { closePicker(); const doc = d.docs[0]; loadSheet(doc.id, doc.name); }
      else if (d.action === google.picker.Action.CANCEL) closePicker();
      else if (google.picker.Action.ERROR && d.action === google.picker.Action.ERROR) { closePicker(); showGuide('error'); }
    })
    .build();
  state.picker = picker;
  picker.setVisible(true);
  // Google's picker has no way out when it fails to load (e.g. blocked cookies), so always offer one.
  const x = document.createElement('button');
  x.id = 'pickerClose'; x.type = 'button'; x.textContent = '✕ Close picker';
  x.addEventListener('click', () => { closePicker(); offerPickerHelp(); });
  document.body.appendChild(x);
}
// After the picker is closed by hand, ask (without blocking) whether it failed.
function offerPickerHelp() {

}
function showGuide(reason = 'pre') {
  const g = cookieGuide();

    pre: [`One step before picking`, `${esc(ENV.label)} blocks the cookies Google's file picker needs, so it would show <i>“We can't access this content”</i>. A one-time settings change fixes it:`],
    error: [`Google's picker couldn't load`, `${esc(ENV.label)} is most likely blocking the cookies Google's file picker needs. To fix it:`],
    noaccess: [`Give the app access to your sheet`, `The app can only open a sheet after you've chosen it once with Google's picker. On ${esc(ENV.label)} that may need a one-time settings change:`],
  }[reason] || [];
  openModal(`<h3 style="text-transform:none">${head[0]}</h3>

      <button class="btn ghost block" data-act="close">Close</button>

}
function closePicker() {

/* ============================ parsing & validation ============================ */
function findHeader(rows, spec) {
  let best = { score: -1, map: {}, row: -1 };
  for (let r = 0; r < Math.min(rows.length, 20); r++) {
    const row = rows[r] || []; const map = {};
    for (const [key, re] of Object.entries(spec.cols)) {
      const idx = row.findIndex(c => re.test(norm(c)));
      if (idx >= 0) map[key] = idx;
    }
    const score = spec.required.filter(k => k in map).length;
    if (score === spec.required.length) return { ok: true, row: r, map };
    if (score > best.score) best = { score, map, row: r };
  }
  return { ok: false, missing: spec.required.filter(k => !(k in best.map)).map(k => spec.names[k]) };
}

function parseWorkbook(meta, raw, tabs) {
  const checks = [];
  const add = (level, msg, detail) => checks.push({ level, msg, detail });
  const m = { title: meta.title, plan: [], days: [], planName: '', cardioTarget: null, library: [], libByName: new Map(), libCats: new Map(), categories: [], history: null, historyRows: [], prev: new Map() };

  // --- tabs exist
  for (const key of Object.keys(SCHEMA)) {
    if (!tabs[key]) add('error', `Tab “${SCHEMA[key].tab}” is missing.`);
  }

  // --- Settings (exercise library)
  if (raw.settings) {
    const h = findHeader(raw.settings, SCHEMA.settings);
    if (!h.ok) add('error', `Couldn't find the header row in “${tabs.settings.title}”.`, `Missing columns: ${h.missing.join(', ')}`);
    else {
      const seen = new Map(); const dups = new Set();
      for (const r of raw.settings.slice(h.row + 1)) {
        const ex = String(r[h.map.exercise] ?? '').trim(); if (!ex) continue;
        const item = { category: String(r[h.map.category] ?? '').trim(), exercise: ex, video: h.map.video != null ? String(r[h.map.video] ?? '').trim() : '' };
        m.library.push(item);
        const k = norm(ex);
        if (!m.libCats.has(k)) m.libCats.set(k, []);
        m.libCats.get(k).push(item.category);
        if (seen.has(k)) { dups.add(ex); if (!m.libByName.get(k).video && item.video) m.libByName.set(k, item); }
        else { seen.set(k, item); m.libByName.set(k, item); }
      }
      const cats = new Map(); m.library.forEach(i => { const k = norm(i.category); if (k && !cats.has(k)) cats.set(k, i.category); });
      m.categories = [...cats.values()].sort((a, b) => a.localeCompare(b));
      add('ok', `Exercise library: ${m.library.length} exercises in ${m.categories.length} categories.`);
      if (dups.size) add('info', `${dups.size} exercise(s) are listed more than once in the library.`, [...dups].join(', '));
    }
  }

  // --- Plan
  if (raw.plan) {
    const h = findHeader(raw.plan, SCHEMA.plan);
    if (!h.ok) add('error', `Couldn't find the header row in “${tabs.plan.title}”.`, `Missing columns: ${h.missing.join(', ')}`);
    else {
      // Plan name: a cell like "Plan Name:" above the header, value in the next non-empty cell
      m.planMeta = { title: tabs.plan.title, sheetId: tabs.plan.sheetId, headerRow: h.row, map: h.map, nameCell: null, cardioCell: null, top: raw.plan.slice(0, h.row) };
      // Weekly cardio target: a "Weekly Cardio (min):" label above the table, value in the cell to its right
      for (const [ri, r] of raw.plan.slice(0, h.row).entries()) {
        const i = (r || []).findIndex(c => /^weekly\s*cardio/i.test(String(c ?? '').trim()));
        if (i < 0) continue;
        m.planMeta.cardioCell = { row: ri, col: i };                       // the label; the value is at col + 1
        const v = parseFloat(String(r[i + 1] ?? '').replace(',', '.'));
        m.cardioTarget = v > 0 ? v : null;
        break;
      }
      for (const [ri, r] of raw.plan.slice(0, h.row).entries()) {
        const i = (r || []).findIndex(c => norm(c).startsWith('plan name'));
        if (i >= 0) {
          const off = r.slice(i + 1).findIndex(c => String(c ?? '').trim() !== '');
          if (off >= 0) m.planName = String(r[i + 1 + off]);
          m.planMeta.nameCell = { row: ri, col: i + 1 + Math.max(0, off) };   // 0-based
          break;
        }
      }
      if (!m.planName) add('warn', 'No “Plan Name:” cell found above the Plan table. Saved rows will have an empty Plan Name.');
      const badSets = [];
      raw.plan.slice(h.row + 1).forEach((r, i) => {
        const day = String(r[h.map.day] ?? '').trim(); const ex = String(r[h.map.exercise] ?? '').trim();
        if (!day || !ex) return;
        const get = k => h.map[k] != null ? String(r[h.map[k]] ?? '').trim() : '';
        const p = { day, category: get('category'), exercise: ex, sets: get('sets'), reps: get('reps'), rest: get('rest'), notes: get('notes'), video: get('video'), row: h.row + i + 2 };
        if (!(parseInt(p.sets) > 0)) badSets.push(`row ${p.row}: ${ex}`);
        m.plan.push(p);
        if (!m.days.includes(day)) m.days.push(day);
      });
      if (!m.plan.length) add('error', 'The Plan tab has no exercises.');
      else add('ok', `Plan “${m.planName.trim() || 'unnamed'}”: ${m.days.length} day(s) — ${m.days.join(', ')} — with ${m.plan.length} exercises.`);
      if (badSets.length) add('warn', `${badSets.length} plan row(s) have no valid “# Sets” (they'll start with 1 set).`, badSets.join('\n'));

      if (m.library.length) {
        const missing = [...new Set(m.plan.filter(p => !m.libByName.has(norm(p.exercise))).map(p => p.exercise))];
        if (missing.length) add('warn', `${missing.length} plan exercise(s) aren't in the Settings library.`, missing.join(', '));
        else add('ok', 'Every plan exercise exists in the Settings library.');
        // Only flag when no library entry with that name has the plan's category (duplicates under several categories are fine).
        const catMismatch = [...new Set(m.plan.filter(p => { const cats = m.libCats.get(norm(p.exercise)); return cats && !cats.some(c => norm(c) === norm(p.category)); })
          .map(p => `${p.exercise}: plan says “${p.category}”, library says “${m.libCats.get(norm(p.exercise)).join('” / “')}”`))];
        if (catMismatch.length) add('warn', `${catMismatch.length} plan exercise(s) have a different category than in the library.`, catMismatch.join('\n'));
      }
      const noVideo = [...new Set(m.plan.filter(p => !p.video && !m.libByName.get(norm(p.exercise))?.video).map(p => p.exercise))];
      if (noVideo.length) add('info', `${noVideo.length} plan exercise(s) have no video link.`, noVideo.join(', '));
    }
  }

  // --- Historical Data
  if (raw.history) {
    const h = findHeader(raw.history, SCHEMA.history);
    if (!h.ok) add('error', `Couldn't find the header row in “${tabs.history.title}”.`, `Missing columns: ${h.missing.join(', ')}`);
    else {
      m.history = { title: tabs.history.title, sheetId: tabs.history.sheetId, rowCount: tabs.history.rowCount, headerRow: h.row, map: h.map };
      raw.history.slice(h.row + 1).forEach(r => {
        const ex = String(r[h.map.exercise] ?? '').trim(); if (!ex) return;
        addHistory(m, { date: r[h.map.date] ?? '', exercise: ex, set: String(r[h.map.set] ?? '').trim(), reps: String(r[h.map.actualReps] ?? '').trim(), wgt: String(r[h.map.actualWgt] ?? '').trim(), notes: String(r[h.map.notes] ?? '').trim(),
          day: String(r[h.map.day] ?? '').trim(), plan: String(r[h.map.plan] ?? '').trim(), category: String(r[h.map.category] ?? '').trim() });
      });
      const last = m.historyRows.length ? m.historyRows[m.historyRows.length - 1].date : null;
      add('ok', `Historical Data: ${m.historyRows.length} logged sets${last ? `, last entry ${last}` : ''}. New sets will be added below them.`);
    }
  }
  return { model: m, checks };
}

function addHistory(m, r) {
  m.historyRows.push(r);
  m.prev.set(`${norm(r.exercise)}|${r.set}`, r);   // later rows overwrite → "most recent"
}
const prevFor = (ex, setNo) => state.model.prev.get(`${norm(ex)}|${setNo}`) || null;
const libVideo = ex => state.model.libByName.get(norm(ex))?.video || '';

/* ============================ cardio & Other sessions ============================ */
// "Other" sessions are off-plan (e.g. just cardio). They're saved with Day = "Other", which isn't a
// plan day, so the plan's next day doesn't move. Cardio exercises record minutes in Actual Reps and
// details (distance, incline, level…) in Notes.
const OTHER = 'Other';
const isCardioCat = c => /cardio/i.test(String(c || ''));
const isCardio = e => isCardioCat(e.category);
const isCardioRow = r => isCardioCat(r.category || state.model?.libByName.get(norm(r.exercise))?.category);
const minutesOf = v => { const n = parseFloat(String(v ?? '').replace(',', '.')); return n > 0 ? n : 0; };
// Weeks run Saturday → Friday.
const weekStartOf = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - (x.getDay() + 1) % 7); return x; };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
function cardioMinutes(m, from, to) {
  if (typeof toDay !== 'function') return 0;
  let n = 0;
  for (const r of m.historyRows) { if (!isCardioRow(r)) continue; const d = toDay(r.date); if (d && d >= from && d < to) n += minutesOf(r.reps); }
  return Math.round(n);
}
const unsavedCardio = () => Math.round((state.entries || []).filter(isCardio).reduce((n, e) => n + e.sets.reduce((k, s) => k + minutesOf(s.reps), 0), 0));
function cardioWeek(m = state.model, day = new Date()) {
  const start = weekStartOf(day), end = addDays(start, 7);
  return { start, end, done: cardioMinutes(m, start, end), target: m.cardioTarget };
}
const shortDate = (d, wd = false) => d.toLocaleDateString('en-GB', wd ? { weekday: 'short', day: 'numeric', month: 'short' } : { day: 'numeric', month: 'short' });
function cardioMeterHTML(w, extra = 0, inPanel = false) {
  if (!w.target) return '';
  const total = w.done + extra, left = Math.max(0, Math.round(w.target - total)), ok = total >= w.target;
  const pct = Math.min(100, Math.round(total / w.target * 100));
  const range = `week runs ${shortDate(w.start, true)} – ${shortDate(addDays(w.end, -1), true)}`;
  const sub = extra ? `With today: ${total} / ${w.target} · ${ok ? 'target reached 🎉' : `${left} min to go`}`
    : ok ? `Target reached this week 🎉 · ${range}` : `${left} min to go · ${range}`;
  return `<div class="cm ${ok ? 'ok' : ''}"><p class="row"><span>🏃 Cardio this week</span><span><b>${total}</b> / ${w.target} min</span></p>
    <div class="bar" role="progressbar" aria-label="Cardio minutes this week" aria-valuemin="0" aria-valuemax="${w.target}" aria-valuenow="${total}"><i style="width:${pct}%"></i></div>
    <div class="sub">${esc(sub)}</div></div>`;
}
function refreshCardioMeter() {
  const el = document.getElementById('cardioMeter');
  if (el && state.model) el.innerHTML = cardioMeterHTML(cardioWeek(), unsavedCardio());
}

/* ============================ PT mode ============================ */
// The Insights dashboards are for the PT (and the owner) only. The password is never stored:
// pt-config.json holds a PBKDF2 hash of it, and a device stays unlocked until "Exit PT mode".
const PT_KEY = 'wl:pt';
let ptCfg = null;
const b64ToBytes = b => Uint8Array.from(atob(b), c => c.charCodeAt(0));
const bytesToB64 = u => btoa(String.fromCharCode(...u));
async function ptConfig() {
  if (!ptCfg) { const r = await fetch('pt-config.json', { cache: 'no-cache' }); if (!r.ok) throw new Error('PT settings not found'); ptCfg = await r.json(); }
  return ptCfg;
}
async function ptHash(password, cfg) {
  const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: b64ToBytes(cfg.salt), iterations: cfg.iterations }, key, 256);
  return bytesToB64(new Uint8Array(bits));
}
const ptActive = () => state.pt === true;
async function loadPtModule() {
  if (typeof renderInsights !== 'function') await loadScript('insights.js');
  if (typeof renderPlan !== 'function') await loadScript('planner.js');
  if (typeof renderTargets !== 'function') await loadScript('targets.js');
  if (typeof renderDiet !== 'function') await loadScript('diet.js');
  if (typeof renderDietPlanner !== 'function') await loadScript('dietpt.js');
}
async function initPt() {
  if (DEMO) state.pt = new URLSearchParams(location.search).has('pt');
  else {
    const saved = store.get(PT_KEY);
    if (saved) {
      try { state.pt = saved === (await ptConfig()).hash; } catch { state.pt = false; }
      if (!state.pt) store.del(PT_KEY);      // password was changed: lock again
    }
  }
  if (state.pt) { try { await loadPtModule(); } catch { state.pt = false; } }
  ptMark();
}
async function unlockPt(password) {
  const cfg = await ptConfig();
  if ((await ptHash(password, cfg)) !== cfg.hash) return false;
  store.set(PT_KEY, cfg.hash); state.pt = true;
  await loadPtModule(); ptMark();
  return true;
}
function exitPt() { store.del(PT_KEY); location.reload(); }   // reload so the dashboard code leaves the page
function ptMark() {
  document.getElementById('ptChip')?.remove();
  if (ptActive()) document.querySelector('.brand').insertAdjacentHTML('beforeend', ' <span class="chip adhoc" id="ptChip">PT</span>');
}
function ptBlockHTML() {
  if (DEMO) return '';
  if (ptActive()) return `<div class="pt-box"><span><b>PT mode is on.</b> <span class="muted">Insights are available on this device.</span></span><button class="text-btn" data-act="pt-exit">Turn off</button></div>`;
  return `<div class="pt-box" id="ptBox">
    <label class="pt-check"><input type="checkbox" id="ptCheck"> PT mode <span class="muted small">(for the PT: unlocks Insights)</span></label>
    <div id="ptForm" hidden>
      <div class="row" style="flex-wrap:nowrap;margin-top:10px">
        <input id="ptPw" type="password" autocomplete="current-password" placeholder="PT password" style="flex:1">
        <button class="btn" data-act="pt-unlock">Unlock</button>
      </div>
      <div class="small" id="ptMsg" style="margin-top:6px"></div>
    </div>
  </div>`;
}
async function tryUnlock() {
  const pw = $('#ptPw')?.value || ''; const msg = $('#ptMsg');
  if (!pw) { msg.textContent = 'Enter the PT password.'; return; }
  msg.textContent = 'Checking…'; msg.className = 'small muted';
  try {
    if (await unlockPt(pw)) { $('#ptBox').outerHTML = ptBlockHTML(); toast('PT mode unlocked'); }
    else { msg.textContent = 'Wrong password. You can still continue without PT mode.'; msg.className = 'small err-text'; $('#ptPw').select(); }
  } catch (e) { msg.textContent = 'Couldn\'t check the password: ' + e.message; msg.className = 'small err-text'; }
}
document.addEventListener('change', e => { if (e.target.id === 'ptCheck') { $('#ptForm').hidden = !e.target.checked; if (e.target.checked) $('#ptPw').focus(); } });
document.addEventListener('keydown', e => { if (e.target.id === 'ptPw' && e.key === 'Enter') { e.preventDefault(); tryUnlock(); } });

/* ============================ flows ============================ */
// Read the three tabs and check them; used on open and after the plan is edited.
async function fetchModel(id) {
  const meta = await state.ds.meta(id);
  const tabs = {};
  for (const [key, spec] of Object.entries(SCHEMA)) tabs[key] = meta.sheets.find(s => norm(s.title) === norm(spec.tab)) || null;
  const keys = Object.keys(tabs).filter(k => tabs[k]);
  const tgtTab = meta.sheets.find(s => norm(s.title) === norm(TGT_TAB)) || null;   // optional, created by the PT
  const ranges = keys.map(k => `${q(tabs[k].title)}!A1:Z`);
  if (tgtTab) ranges.push(`${q(tgtTab.title)}!A1:I`);
  // Diet (optional): Foods + Diet Plan are small and come in the same request. The Diet Log is
  // only read when the Diet screens open.
  const dietTabs = { foods: meta.sheets.find(s => norm(s.title) === 'foods') || null, plan: meta.sheets.find(s => norm(s.title) === 'diet plan') || null,
    log: meta.sheets.find(s => norm(s.title) === 'diet log') || null };
  const dIdx = ranges.length;
  if (dietTabs.foods) ranges.push(`${q(dietTabs.foods.title)}!A1:H`);
  if (dietTabs.plan) ranges.push(`${q(dietTabs.plan.title)}!A1:J`);
  const values = await state.ds.batchGet(id, ranges);
  const raw = {}; keys.forEach((k, i) => raw[k] = values[i]);
  const res = parseWorkbook(meta, raw, tabs);
  res.model.targets = tgtTab ? parseTargets(values[keys.length]) : new Map();
  let k = dIdx;
  res.model.dietRaw = { tabs: dietTabs, foods: dietTabs.foods ? values[k++] : null, plan: dietTabs.plan ? values[k++] : null };
  res.model.hasDiet = !!res.model.dietRaw.plan?.some(r => norm(r?.[0]) === 'plan' && String(r?.[2] ?? '').trim());
  return { meta, ...res };
}

/* ============================ PT targets ============================ */
// The PT can set reps/weight per set for any day of the plan. They live in a small "PT Targets"
// tab holding at most one block per plan day: saving a day replaces that day's block. When the
// trainee saves that day's workout the block is marked "Used on <date>" (kept, so the PT can
// reuse it with one tap) and stops showing to the trainee.
const TGT_TAB = 'PT Targets';
const TGT_HEAD = ['Day', 'Exercise', 'Set', 'Reps', 'Weight', 'Note', 'Plan Name', 'Saved at', 'Used on'];
const TGT_COLS = TGT_HEAD.length;
const str = v => String(v ?? '').trim();
const tgtFilled = s => !!s && (str(s.reps) !== '' || str(s.wgt) !== '');
// → Map(norm(day) → { day, plan, savedAt, usedOn, items: Map(norm(ex) → { exercise, sets: [{reps, wgt, note}] }) })
function parseTargets(rows) {
  const out = new Map();
  if (!rows || rows.length < 2) return out;
  const head = (rows[0] || []).map(norm), ix = k => head.indexOf(norm(k));
  const I = { day: ix('Day'), ex: ix('Exercise'), set: ix('Set'), reps: ix('Reps'), wgt: ix('Weight'), note: ix('Note'), plan: ix('Plan Name'), at: ix('Saved at'), used: ix('Used on') };
  if (I.day < 0 || I.ex < 0 || I.set < 0) return out;
  const get = (r, k) => I[k] >= 0 ? str(r[I[k]]) : '';
  for (const r of rows.slice(1)) {
    const day = get(r, 'day'), ex = get(r, 'ex'), set = parseInt(get(r, 'set'));
    if (!day || !ex || !(set > 0 && set <= 20)) continue;
    const dk = norm(day);
    if (!out.has(dk)) out.set(dk, { day, plan: get(r, 'plan'), savedAt: get(r, 'at'), usedOn: get(r, 'used'), items: new Map() });
    const b = out.get(dk), k = norm(ex);
    if (!b.items.has(k)) b.items.set(k, { exercise: ex, sets: [] });
    b.items.get(k).sets[set - 1] = { reps: get(r, 'reps'), wgt: get(r, 'wgt'), note: get(r, 'note') };
  }
  for (const b of out.values()) for (const it of b.items.values()) for (let j = 0; j < it.sets.length; j++) it.sets[j] = it.sets[j] || { reps: '', wgt: '', note: '' };
  return out;
}
// "2026-11-21 18:40" (the PT's local time) → Date
const tgtTime = t => { const m = str(t?.savedAt).match(/^(\d{4})-(\d{2})-(\d{2})(?:[ T](\d{1,2}):(\d{2}))?/); return m ? new Date(+m[1], m[2] - 1, +m[3], +(m[4] || 0), +(m[5] || 0)) : null; };
const fmtShort = d => d ? d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }) : '';
// Normally the trainee's save marks a block as used. As a safety net, a block also counts as
// used once that day has been logged on a later date than it was saved.
function targetsUsed(b, m = state.model) {
  if (b.usedOn) return true;
  const at = tgtTime(b); if (!at || typeof toDay !== 'function') return false;
  const day0 = new Date(at.getFullYear(), at.getMonth(), at.getDate()), pn = norm(m.planName);
  return m.historyRows.some(r => norm(r.day) === norm(b.day) && (!pn || !r.plan || norm(r.plan) === pn) && (toDay(r.date) || 0) > day0);
}
// The block for a day under the current plan (used or not), or null.
function targetBlock(day, m = state.model) {
  const b = m?.targets?.get(norm(day));
  if (!b || (b.plan && norm(b.plan) !== norm(m.planName)) || !m.days.some(d => norm(d) === norm(day))) return null;
  return [...b.items.values()].some(it => it.sets.some(tgtFilled)) ? b : null;
}
function activeTargets(day = state.day, m = state.model) {
  const b = targetBlock(day, m);
  return b && !targetsUsed(b, m) ? b : null;
}
function targetFor(e, day = state.day) {
  const t = activeTargets(day);
  if (!t || e.adhoc || isCardio(e)) return null;
  const it = t.items.get(norm(e.exercise));
  return it && it.sets.some(tgtFilled) ? it : null;
}
const tgtText = s => str(s.reps) && str(s.wgt) ? `${s.reps} × ${s.wgt}` : str(s.wgt) ? `${s.wgt} kg` : `${s.reps} reps`;
function agoText(d) {
  if (!d) return '';
  const min = Math.round((Date.now() - d) / 60000);
  if (min < 1) return 'just now';
  if (min < 60) return `${min} min ago`;
  if (min < 24 * 60 && d.getDate() === new Date().getDate()) return `today ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  return d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
}
// Match each exercise's number of sets to the PT's (only adds sets, or removes empty ones at the end).
function applyTargetSets() {
  (state.entries || []).forEach(e => {
    const tg = targetFor(e); if (!tg) return;
    while (e.sets.length < tg.sets.length) e.sets.push({ reps: '', wgt: '', note: '', showNote: false });
    while (e.sets.length > tg.sets.length) {
      const s = e.sets[e.sets.length - 1];
      if (isFilled(s) || s.note || s.done) break;
      e.sets.pop();
    }
  });
}
function ptSyncHTML() {
  const t = activeTargets();
  if (!t) {
    const others = state.model.days.filter(d => activeTargets(d));
    return others.length ? `<div class="day-note">🧑‍🏫 Your PT set targets for <b>${others.map(esc).join(', ')}</b>.</div>` : '';
  }
  return `<div class="pt-sync"><span>🧑‍🏫 Your PT set targets for this session · updated ${esc(agoText(tgtTime(t)))}</span><button class="text-btn" data-act="pt-refresh">↻ Refresh</button></div>`;
}
// Read the targets again while the trainee logs (every 30 s, and on ↻). Only the cards that
// changed are redrawn, and whatever the trainee typed is never touched.
async function refreshTargets(manual = false) {
  if (state.tgtBusy || !state.model || !state.sheet) return;
  state.tgtBusy = true;
  try {
    let rows = [];
    try { [rows] = await state.ds.batchGet(state.sheet.id, [`${q(TGT_TAB)}!A1:I`]); }
    catch (e) { if (e instanceof AuthError || e.status !== 400) throw e; }   // 400: the tab doesn't exist yet
    const before = state.entries.map(e => targetFor(e));
    state.model.targets = parseTargets(rows);
    applyTargetSets();
    const changed = [];
    state.entries.forEach((e, i) => {
      const a = before[i], b = targetFor(e);
      if (JSON.stringify(a?.sets || null) === JSON.stringify(b?.sets || null)) return;
      changed.push(i);
      if (a && b) b.sets.forEach((s, j) => { if (JSON.stringify(s) !== JSON.stringify(a.sets[j] || null)) state.tgtChanged.add(`${norm(e.exercise)}|${j}`); });
    });
    if (!$('#cards')) return;                     // not on the logging screen any more
    const focus = document.activeElement?.dataset?.f ? { f: document.activeElement.dataset.f, i: document.activeElement.dataset.i, j: document.activeElement.dataset.j, pos: document.activeElement.selectionStart } : null;
    changed.forEach(i => rerenderCard(i));
    const sync = $('#ptSync'); if (sync) sync.innerHTML = ptSyncHTML();
    document.querySelectorAll('.day').forEach(b => b.classList.toggle('tgt', !!activeTargets(b.dataset.day)));
    if (focus) { const el = document.querySelector(`[data-f="${focus.f}"][data-i="${focus.i}"][data-j="${focus.j}"]`); if (el) { el.focus(); try { el.setSelectionRange(focus.pos, focus.pos); } catch {} } }
    if (changed.length && !manual) {
      toast(before.some(Boolean) ? 'Your PT updated the targets' : 'Your PT set targets for this session');
      try { navigator.vibrate?.(40); } catch {}
      clearTimeout(state.tgtChgTimer);
      state.tgtChgTimer = setTimeout(() => { state.tgtChanged.clear(); document.querySelectorAll('.ptcell.chg').forEach(el => el.classList.remove('chg')); }, 15000);
    }
    if (manual) toast(state.entries.some(e => targetFor(e)) ? 'PT targets are up to date' : 'No PT targets for this session');
  } catch (e) {
    if (manual) toast(e instanceof AuthError ? 'Your Google sign-in expired. Sign in again to refresh.' : 'Couldn\'t refresh: ' + e.message, 4000);
  } finally { state.tgtBusy = false; }
}
setInterval(() => {
  if (document.visibilityState === 'visible' && $('#cards') && !state.saving && (DEMO || tokenValid())) refreshTargets(false);
}, 30000);
// After the day's workout is saved its targets are used: stamp "Used on" (the PT can reuse them).
async function markTargetsUsed(day, when) {
  const id = state.sheet.id;
  const [rows] = await state.ds.batchGet(id, [`${q(TGT_TAB)}!A1:I`]);
  if (!rows || rows.length < 2) return;
  const col = TGT_COLS - 1;
  const vals = rows.slice(1).map(r => [norm(r[0]) === norm(day) && !str(r[col]) ? when : str(r[col])]);
  await state.ds.update(id, `${q(TGT_TAB)}!${colLetter(col)}1:${colLetter(col)}${rows.length}`, [[TGT_HEAD[col]], ...vals], 'RAW');
}
async function loadSheet(id, name) {
  state.sheet = { id, name };
  $('#sheetName').textContent = name || '';
  renderLoading('Reading and checking your sheet…');
  try {
    const { meta, model, checks } = await fetchModel(id);
    state.sheet.name = meta.title; $('#sheetName').textContent = meta.title;
    state.model = model; state.checks = checks;
    if (!DEMO) store.set('wl:lastSheet', { id, name: meta.title });
    renderValidation();
  } catch (e) {
    if (e instanceof AuthError) return renderSignin(e.message);
    const noAccess = e.status === 403 || e.status === 404;

  }

// Which day to open: an unsaved workout first, otherwise the day after the last one saved,
// following the order of days in the Plan tab (wrapping round after the last day).
function suggestDay() {
  const m = state.model;
  const drafts = [...m.days, OTHER].map(d => ({ day: d, at: store.get(draftKey(d))?.at || 0 })).filter(x => x.at).sort((a, b) => b.at - a.at);
  if (drafts.length) return { day: drafts[0].day, why: 'draft' };
  return nextPlanDay(m);
}
// The day after the last one saved under the current plan (used for logging and for PT targets).
function nextPlanDay(m = state.model) {
  const pn = norm(m.planName);
  const idxOf = d => m.days.findIndex(x => norm(x) === norm(d));
  for (let i = m.historyRows.length - 1; i >= 0; i--) {
    const r = m.historyRows[i];
    if (idxOf(r.day) < 0 || (pn && r.plan && norm(r.plan) !== pn)) continue;
    return { day: m.days[(idxOf(r.day) + 1) % m.days.length], why: 'next', after: m.days[idxOf(r.day)], date: r.date };
  }
  return { day: m.days[0], why: 'first' };
}
function dayNoteHTML() {
  if (state.day === OTHER) return `<div class="day-note"><b>Other session</b>, not part of the plan. <b>${esc(nextPlanDay().day)}</b> stays your next plan day.</div>`;
  const s = state.suggestion;
  if (!s || s.day !== state.day) return '';
  let when = '';
  if (s.date && typeof toDay === 'function') { const d = toDay(s.date); if (d) when = ` on ${d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' })}`; }
  const text = s.why === 'draft' ? 'You have an unsaved workout for this day.'
    : s.why === 'next' ? `Next in your plan: your last workout was <b>${esc(s.after)}</b>${esc(when)}.`
    : 'First day of your plan.';
  return `<div class="day-note">${text}</div>`;
}
function startLogging(day) {
  state.day = day;
  store.set(`wl:lastDay:${state.sheet.id}`, day);
  const draft = store.get(draftKey(day));
  if (draft?.entries?.length) { state.entries = draft.entries; state.restored = true; }
  else { state.entries = entriesForDay(day); state.restored = false; }
  applyTargetSets();
  renderLogger();
}
function entriesForDay(day) { return state.model.plan.filter(p => p.day === day).map(p => makeEntry(p, false)); }
function makeEntry(p, adhoc) {
  const n = Math.max(1, Math.min(20, parseInt(p.sets) || 1));
  return { uid: uid(), exercise: p.exercise, category: p.category, targetReps: p.reps, rest: p.rest || '', notes: p.notes || '',
           video: p.video || libVideo(p.exercise), adhoc, sets: Array.from({ length: n }, () => ({ reps: '', wgt: '', note: '', showNote: false })) };
}
let draftTimer;
function saveDraft() {
  clearTimeout(draftTimer);
  draftTimer = setTimeout(() => {
    const any = state.entries.some(e => e.adhoc || e.sets.some(s => isFilled(s) || s.note));
    if (any) store.set(draftKey(state.day), { entries: state.entries, at: Date.now() }); else store.del(draftKey(state.day));
    document.querySelectorAll('.day').forEach(b => b.classList.toggle('draft', !!store.get(draftKey(b.dataset.day))));
  }, 300);
}

function collectRows(when) {
  const rows = [];
  for (const e of state.entries) e.sets.forEach((s, j) => {
    if (!isFilled(s)) return;
    const p = prevFor(e.exercise, j + 1);
    const wgt = num(s.wgt);
    const ts = targetFor(e)?.sets[j], pt = tgtFilled(ts);      // the PT's target for this set, when there is one
    rows.push({ date: when, day: state.day, category: e.category, exercise: e.exercise, set: j + 1,
      targetReps: pt && str(ts.reps) ? num(ts.reps) : num(e.targetReps), actualReps: num(s.reps),
      targetWgt: isCardio(e) ? '' : pt && str(ts.wgt) ? num(ts.wgt) : p && String(p.wgt).trim() !== '' ? num(p.wgt) : wgt,   // otherwise last session's weight for this set
      actualWgt: wgt, notes: [(s.note || '').trim(), pt ? 'PT target' : ''].filter(Boolean).join(' · '), plan: state.model.planName });
  });
  return rows;
}

async function writeRows(objs, { checkDuplicate = false } = {}) {
  const H = state.model.history, id = state.sheet.id;
  const cols = Object.values(H.map), minCol = Math.min(...cols), maxCol = Math.max(...cols);
  // Re-read the tab right before writing so we append after the true last row.
  const meta = await state.ds.meta(id);
  const tab = meta.sheets.find(s => s.sheetId === H.sheetId) || meta.sheets.find(s => s.title === H.title);
  const [fresh] = await state.ds.batchGet(id, [`${q(tab.title)}!A1:${colLetter(maxCol)}`]);
  const lastUsed = Math.max(fresh.length, H.headerRow + 1);          // 1-based
  if (checkDuplicate && fresh.length - H.headerRow - 1 >= objs.length) {
    // A retry after an unclear failure: if the last rows already match, the first attempt got through.
    const tail = fresh.slice(-objs.length), M = H.map, same = (a, b) => String(a ?? '').trim() === String(b ?? '').trim();
    if (tail.every((r, k) => same(r[M.exercise], objs[k].exercise) && same(r[M.set], objs[k].set) && same(r[M.actualReps], objs[k].actualReps) && same(r[M.actualWgt], objs[k].actualWgt) && same(r[M.day], objs[k].day)))
      return { range: `${q(tab.title)} (already saved)`, alreadySaved: true };
  }
  const start = lastUsed + 1, end = start + objs.length - 1;
  if (end > tab.rowCount) await state.ds.addRows(id, tab.sheetId, end - tab.rowCount + 20);
  const values = objs.map(o => {
    const row = Array(maxCol - minCol + 1).fill(null);                // null = leave cell untouched
    for (const [k, idx] of Object.entries(H.map)) row[idx - minCol] = o[k] ?? '';
    return row;
  });
  const range = `${q(tab.title)}!${colLetter(minCol)}${start}:${colLetter(maxCol)}${end}`;
  await state.ds.update(id, range, values);
  return { range };
}

// Every outcome of a save is shown in the modal the user is looking at: saving → saved / not saved.
async function doSave(whenStr, { retry = false } = {}) {
  const rows = collectRows(whenStr);
  if (!rows.length || state.saving) return;
  state.pendingWhen = whenStr;
  state.saving = true; updateSaveBar();
  const exCount = new Set(rows.map(r => r.exercise)).size;
  openModal(`<div class="center" style="padding:18px 0"><div class="spinner"></div><b>Saving ${rows.length} set${rows.length > 1 ? 's' : ''}…</b><p class="muted small">Keep this page open.</p></div>`, { locked: true });
  try {
    const usedTargets = state.entries.some(e => targetFor(e));
    const res = await writeRows(rows, { checkDuplicate: retry });
    rows.forEach(r => addHistory(state.model, { date: r.date, exercise: r.exercise, set: String(r.set), reps: String(r.actualReps), wgt: String(r.actualWgt), notes: r.notes, day: r.day, plan: r.plan, category: r.category }));
    store.del(draftKey(state.day));
    if (usedTargets) {                         // used up; if stamping fails, the date check in targetsUsed covers it
      const b = state.model.targets?.get(norm(state.day)); if (b) b.usedOn = whenStr;
      markTargetsUsed(state.day, whenStr).catch(() => {});
    }
    if (typeof INS !== 'undefined') INS.data = null;   // insights and hints reload
    state.lastWrite = { range: res.range, rows };
    const wasOther = state.day === OTHER, savedDay = state.day;
    const cardioMin = Math.round(rows.filter(r => isCardioCat(r.category)).reduce((n, r) => n + minutesOf(r.actualReps), 0));
    if (wasOther) { state.suggestion = suggestDay(); startLogging(state.suggestion.day); }   // back to the plan
    else { state.entries = entriesForDay(state.day); state.restored = false; state.suggestion = null; renderLogger(); }
    window.scrollTo({ top: 0 });
    try { navigator.vibrate?.(60); } catch {}
    const d = new Date(`${whenStr}T12:00:00`);
    const cw = cardioMin && state.model.cardioTarget && !isNaN(d) ? cardioWeek(state.model, d) : null;
    openModal(`<div class="result ok"><div class="r-icon" aria-hidden="true">✓</div><h3>Workout saved</h3>
      <p><b>${rows.length} set${rows.length > 1 ? 's' : ''}</b> from <b>${exCount} exercise${exCount > 1 ? 's' : ''}</b> ${res.alreadySaved ? 'were already' : 'were'} added to Historical Data for <b>${esc(savedDay)}</b>, ${esc(isNaN(d) ? whenStr : d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }))}.</p>
      ${cw ? `<p>🏃 Cardio that week: <b>${cw.done}</b> / ${cw.target} min${cw.done >= cw.target ? ' · target reached 🎉' : ` · ${Math.round(cw.target - cw.done)} min to go`}</p>` : ''}
      ${wasOther ? `<p class="small muted">Back to the plan: <b>${esc(state.day)}</b> is next.</p>` : ''}
      <button class="btn block" data-act="close">Done</button>
      ${DEMO ? `<button class="btn ghost block" data-act="demo-rows" style="margin-top:10px">See the rows written (demo)</button>` : ''}</div>`, { locked: true });
  } catch (e) {
    const auth = e instanceof AuthError;
    try { navigator.vibrate?.([80, 60, 80]); } catch {}
    openModal(`<div class="result err"><div class="r-icon" aria-hidden="true">!</div><h3>Not saved yet</h3>
      <p>${auth ? 'Your Google sign-in expired (it lasts about an hour), so the workout couldn\'t be saved.' : `Something went wrong while saving: <span class="muted">${esc(e.message)}</span>`}</p>
      <p class="muted small">Your entries are safe on this device. Nothing is lost.</p>
      <button class="btn block" data-act="${auth ? 'reauth-save' : 'retry-save'}">${auth ? 'Sign in &amp; save' : 'Try again'}</button>
      <button class="btn ghost block" data-act="close" style="margin-top:10px">Not now</button></div>`, { locked: true });
  } finally { state.saving = false; updateSaveBar(); }
}

function sheetIdFrom(text) {

}

function setHTML(e, i, s, j) {

    ${s.showNote || s.note ? `<div class="set-note"><input data-f="note" ${a} value="${esc(s.note)}" placeholder="Note for set ${j + 1} (e.g. Failure)" dir="auto"></div>` : ''}`;
}

/* ============================ events ============================ */
document.addEventListener('click', async ev => {
  const t = ev.target.closest('[data-act]'); if (!t) return;
  const act = t.dataset.act, i = Number(t.dataset.i), j = Number(t.dataset.j);
  const e = state.entries[i];
  switch (act) {
    case 'close': closeModal(); break;
    case 'signin':
      try { await requestToken(); const last = store.get('wl:lastSheet'); last ? loadSheet(last.id, last.name) : renderPick(); }
      catch (err) { renderSignin(err.message); }
      break;
    case 'reauth':
      try { await requestToken(); state.authLost = false; renderLogger(); toast('Signed in again, tap Save'); } catch (err) { toast(err.message); }
      break;
    case 'change-sheet': closeModal(); renderPick(); window.scrollTo({ top: 0 }); break;
    case 'back-to-log': state.day ? renderLogger() : renderValidation(); break;
    case 'tab':
      if (t.dataset.tab === 'insights' && ptActive() && typeof renderInsights === 'function') { saveDraft(); renderInsights(); }
      else if (t.dataset.tab === 'plan' && ptActive() && typeof renderPlan === 'function') { saveDraft(); renderPlan(); }
      else if (t.dataset.tab === 'targets' && ptActive() && typeof renderTargets === 'function') { saveDraft(); renderTargets(); }
      else if (t.dataset.tab === 'diet' && state.model?.hasDiet) openDiet();
      else if (state.day !== OTHER && !state.model.days.includes(state.day)) { state.suggestion = suggestDay(); startLogging(state.suggestion.day); }   // plan changed
      else renderLogger();
      window.scrollTo({ top: 0 }); break;
    case 'guide': closeModal(); showGuide(t.dataset.reason); break;
    case 'pt-unlock': tryUnlock(); break;
    case 'pt-exit': closeModal(); exitPt(); break;
    case 'pick-now':
      closeModal(); state.guideSeen = true;
      if (!tokenValid()) { try { await requestToken(); } catch (err) { return renderSignin(err.message); } }
      openPicker(); break;
    case 'pick':
      closeModal();
      // Browsers known to block the picker get the fix-it steps first (once per visit).
      if (ENV.likelyBlocked && !state.guideSeen) { state.guideSeen = true; showGuide('pre'); break; }
      if (!tokenValid()) { try { await requestToken(); } catch (err) { return renderSignin(err.message); } }
      openPicker(); break;
    case 'openurl': {
      const id = sheetIdFrom($('#sheetUrl')?.value);
      if (!id) { toast('That doesn\'t look like a Google Sheets link.'); break; }
      if (!tokenValid()) { try { await requestToken(); } catch (err) { return renderSignin(err.message); } }
      loadSheet(id, ''); break;
    }
    case 'openlast': { const last = store.get('wl:lastSheet'); if (last) loadSheet(last.id, last.name); break; }
    case 'signout':
      closeModal();
      if (state.token) google.accounts.oauth2.revoke(state.token, () => {});
      state.token = null; state.model = null; state.sheet = null; $('#sheetName').textContent = '';
      renderSignin(); break;
    case 'show-checks': closeModal(); renderValidation(); break;
    case 'continue': state.suggestion = suggestDay(); startLogging(state.suggestion.day); break;
    case 'day': if (t.dataset.day !== state.day) { saveDraft(); startLogging(t.dataset.day); window.scrollTo({ top: 0 }); } break;
    case 'discard':
      if (confirm(`Discard the unsaved entries for ${state.day}?`)) { store.del(draftKey(state.day)); state.entries = entriesForDay(state.day); state.restored = false; renderLogger(); }
      break;
    case 'video': showVideo(e); break;
    case 'fill': {
      const p = prevFor(e.exercise, j + 1); if (!p) break;
      e.sets[j].reps = p.reps;
      if (isCardio(e)) e.sets[j].note = p.notes || ''; else e.sets[j].wgt = p.wgt;
      rerenderCard(i); saveDraft(); break;
    }
    case 'other':
      saveDraft(); startLogging(OTHER); window.scrollTo({ top: 0 });
      if (!state.entries.length) showAdhoc();
      break;
    case 'pt-fill': {
      const ts = targetFor(e)?.sets[j]; if (!tgtFilled(ts)) break;
      if (str(ts.reps)) e.sets[j].reps = str(ts.reps);
      if (str(ts.wgt)) e.sets[j].wgt = str(ts.wgt);
      rerenderCard(i); saveDraft();
      if (e.sets[j].done && typeof restartRestFor === 'function') restartRestFor(i, j);
      break;
    }
    case 'pt-refresh': refreshTargets(true); break;
    case 'note': e.sets[j].showNote = !e.sets[j].showNote || !!e.sets[j].note; rerenderCard(i);
      document.querySelector(`.set-note input[data-i="${i}"][data-j="${j}"]`)?.focus(); break;
    case 'done': {
      const st = e.sets[j];
      if (!st.done) {
        // Ticking an empty set fills in the plan's reps and last time's weight.
        // With PT targets, those numbers are used instead.
        const p = prevFor(e.exercise, j + 1), ts = targetFor(e)?.sets[j];
        if (String(st.reps).trim() === '' && ts && str(ts.reps)) st.reps = str(ts.reps);
        if (String(st.wgt).trim() === '' && ts && str(ts.wgt)) st.wgt = str(ts.wgt);
        if (String(st.reps).trim() === '' && /^\d+(\.\d+)?$/.test(String(e.targetReps).trim())) st.reps = String(e.targetReps).trim();
        if (String(st.wgt).trim() === '' && p && String(p.wgt).trim() !== '' && !isCardio(e)) st.wgt = String(p.wgt).trim();
        st.done = true; rerenderCard(i); saveDraft();
        if (typeof startRest === 'function' && !isCardio(e)) startRest(i, j);   // no rest timer after cardio
      } else {
        st.done = false; rerenderCard(i); saveDraft();
        if (typeof restBelongsTo === 'function' && restBelongsTo(i, j)) stopRest();
      }
      break;
    }
    case 'addset': e.sets.push({ reps: '', wgt: '', note: '', showNote: false }); rerenderCard(i); saveDraft(); break;
    case 'rmset': if (e.sets.length > 1) { if (typeof restBelongsTo === 'function' && restBelongsTo(i, e.sets.length - 1)) stopRest(); e.sets.pop(); rerenderCard(i); saveDraft(); } break;
    case 'rmex': state.entries.splice(i, 1); renderLogger(); saveDraft(); break;
    case 'adhoc': showAdhoc(); break;
    case 'adhoc-add': addAdhoc(); break;
    case 'confirm-save': {
      const v = $('#when').value;   // already YYYY-MM-DD
      const when = /^\d{4}-\d{2}-\d{2}$/.test(v) ? v : toSheetDate(new Date());
      if (!DEMO && !tokenValid()) {                 // sign in first; must start inside this tap
        try { await requestToken(); } catch (err) { toast(err.message, 4000); break; }
      }
      doSave(when); break;
    }
    case 'reauth-save':
      if (!DEMO) { try { await requestToken(); } catch (err) { toast(err.message, 4000); break; } }
      doSave(state.pendingWhen, { retry: false }); break;
    case 'retry-save':
      if (!DEMO && !tokenValid()) { try { await requestToken(); } catch (err) { toast(err.message, 4000); break; } }
      doSave(state.pendingWhen, { retry: true }); break;
    case 'demo-rows': if (state.lastWrite) showDemoWrite(state.lastWrite.range, state.lastWrite.rows); break;
  }
});
